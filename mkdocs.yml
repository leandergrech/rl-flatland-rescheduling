site_name: RL for Flatland train rescheduling
site_description: A personal literature review and CPU-sized codebase for multi-agent RL train rescheduling on Flatland
site_author: Leander Grech
repo_url: https://github.com/leandergrech/rl-flatland-rescheduling
site_url: https://leandergrech.github.io/rl-flatland-rescheduling/
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - For Leander: for-leander.md
  - 1. The problem: 01-problem.md
  - 2. Domain primer: 02-primer.md
  - 3. Timeline 2019-2026: 03-timeline.md
  - 4. Solution designs: 04-designs.md
  - 5. Limitations: 05-limitations.md
  - 6. Open questions: 06-open-questions.md
  - 7. References: 07-references.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/base.css
  - stylesheets/theme.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  links:
    anchors: warn
