site_name: RL for Flatland train rescheduling
site_description: Can reinforcement learning beat planning at train rescheduling? A reproduced OR planner, learned baselines and a learned dispatcher on Flatland, with an in-browser Scheduling Lab
site_author: Leander Grech
repo_url: https://github.com/leandergrech/rl-flatland-rescheduling
site_url: https://leandergrech.github.io/rl-flatland-rescheduling/
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Understand the problem:
      - The control problem: 01-problem.md
      - "How it works: start here": 02-primer.md
      - The rail network: how/1-network.md
      - Trains, timetables and breakdowns: how/2-trains.md
      - Conflicts and deadlock: how/3-deadlock.md
      - Planning with reservations: how/4-planning.md
      - Executing a plan under disruption: how/5-execution.md
      - Learning on top of the plan: how/6-learning.md
      - The Scheduling Lab: how/7-lab.md
  - Explore the experiments:
      - Methods and evaluation: research/methodology.md
      - Designs and results: 04-designs.md
      - TADA on rails: 08-tada-dispatcher.md
      - Limitations: 05-limitations.md
      - Open questions: 06-open-questions.md
  - Inspect the implementation:
      - Architecture: implementation/architecture.md
      - Reproducing the results: implementation/reproduce.md
  - Literature:
      - The MAPF toolkit: literature/mapf.md
      - Timeline 2019–2026: 03-timeline.md
      - References: 07-references.md
      - Glossary and formulas: literature/glossary.md
  - About:
      - About this project: about.md
      - "Study notes: from air traffic to rail": for-leander.md

hooks:
  - hooks/strip_svg_metadata.py
  - hooks/asset_versions.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/base.css
  - stylesheets/theme.css
  - stylesheets/site.css
  - stylesheets/lab.css

extra_javascript:
  - javascripts/flatland-core.js
  - javascripts/tada-core.js
  - javascripts/rail-draw.js
  - javascripts/widgets.js
  - javascripts/lab.js
  - javascripts/nav.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  links:
    anchors: warn
