[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_flatland"
version = "0.1.0"
description = "Mid-size Flatland train-rescheduling scenarios with OR, PPO and imitation-then-RL baselines"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Leander Grech" }]
requires-python = ">=3.10"
dependencies = [
    "flatland-rl==4.3.0",
    "torch>=2.2",
    "numpy<2",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "nbformat",
    "nbconvert",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
